name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run audit
      - run: npm run verify
      - run: npm run make:windows
      - run: npm run verify:fuses
      - run: npm run verify:windows-artifacts
      - run: npm run test:e2e:prepared

  e2e-linux:
    name: Runtime E2E (Linux/Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run package
      - run: xvfb-run -a npm run test:e2e:prepared
