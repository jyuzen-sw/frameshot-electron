version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      electron-forge:
        patterns:
          - electron
          - "@electron-forge/*"
          - "@electron/fuses"
          - electron-squirrel-startup
          - "@types/electron-squirrel-startup"
      test-tooling:
        patterns:
          - vitest
          - "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
